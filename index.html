<style>
:root {
    --verde-logo: #005a36;
    --naranja-logo: #e06e28;
    --crema-fondo: #fbf8f3;
    --tarjeta-bg: #ffffff;
    --texto-oscuro: #232323;
    --texto-secundario: #6e7278;
    --borde-suave: #e8e2d8;
    --naranja-boton: #e87a5d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--crema-fondo); color: var(--texto-oscuro); padding: 24px 0; }
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
.top-subheading { font-size: 0.72rem; letter-spacing: 2px; font-weight: 700; color: var(--naranja-logo); text-transform: uppercase; margin-bottom: 12px; }
.header-main { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.brand-header { display: flex; flex-direction: column; }
.brand-header .sub-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; letter-spacing: 6px; color: #4a4a4a; font-weight: 600; line-height: 1; }
.brand-header .main-title { font-family: 'Cormorant Garamond', serif; color: var(--verde-logo); font-size: 2.6rem; font-weight: 700; letter-spacing: 2px; line-height: 1.05; margin: 4px 0; text-transform: uppercase; }
.brand-header .main-title span { font-size: 2rem; font-weight: 600; }
.brand-header .location-brand { font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; letter-spacing: 10px; color: #555555; font-weight: 600; margin-bottom: 8px; }
.brand-header .subtitle { color: var(--naranja-logo); font-size: 0.95rem; font-weight: 600; }
.header-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--naranja-logo); text-align: right; max-width: 270px; font-size: 1.05rem; line-height: 1.35; }
.nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid var(--borde-suave); padding-bottom: 2px; }
.tab-btn { background: none; border: none; padding: 10px 20px; font-size: 0.95rem; font-weight: 700; color: var(--texto-secundario); cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.2s; }
.tab-btn.active { color: var(--verde-logo); border-bottom: 3px solid var(--verde-logo); background-color: #ffffff; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.hero-banner { position: relative; width: 100%; height: 430px; border-radius: 18px; overflow: hidden; background-image: url('https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0f/d4/4c/14/estancia-altos-de-vera.jpg?w=900&h=500&s=1'); background-size: cover; background-position: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 20px; }
.hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%); display: flex; flex-direction: column; justify-content: space-between; padding: 24px; }
.hero-top-bar { display: flex; justify-content: space-between; align-items: center; }
.location-tag { background-color: rgba(0, 90, 54, 0.88); color: #ffffff; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; text-decoration: none; }
.btn-upload-photo { background-color: rgba(255, 255, 255, 0.92); color: var(--texto-oscuro); border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.hero-bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
.hero-text { color: #ffffff; max-width: 480px; }
.hero-text .brand-tag { font-size: 0.72rem; letter-spacing: 1.5px; font-weight: 700; color: #f7a072; text-transform: uppercase; margin-bottom: 4px; }
.hero-actions { display: flex; gap: 12px; }
.btn-start-survey { background-color: var(--naranja-boton); color: #ffffff; border: none; padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
.survey-card, .dashboard-card { background-color: var(--tarjeta-bg); border: 1px solid var(--borde-suave); border-radius: 16px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
.info-box { background-color: rgba(251, 248, 243, 0.8); border: 1px dashed #ded6c8; border-radius: 12px; padding: 20px; margin-bottom: 35px; }
.info-box-title { font-size: 0.75rem; letter-spacing: 1.2px; font-weight: 700; color: var(--naranja-logo); text-transform: uppercase; margin-bottom: 15px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
.form-group label { display: block; font-size: 0.8rem; color: var(--texto-secundario); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--borde-suave); border-radius: 8px; font-size: 0.9rem; outline: none; }
.question-block { margin-bottom: 35px; padding-top: 25px; border-top: 1px solid #f0eae1; }
.question-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 15px; }
.question-number { background-color: var(--verde-logo); color: #ffffff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
.question-title { font-family: 'Cormorant Garamond', serif; color: var(--verde-logo); font-size: 1.25rem; font-weight: 700; }
.options-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 15px; }
.options-grid-nps { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; margin-top: 15px; }
.option-card { border: 1px solid var(--borde-suave); background-color: #ffffff; border-radius: 12px; padding: 16px 8px; text-align: center; cursor: pointer; }
.option-card.selected { border-color: var(--verde-logo); background-color: #e8f3ee; box-shadow: 0 0 0 1px var(--verde-logo); }
.action-container { display: flex; justify-content: flex-end; margin-top: 30px; }
.btn-continue { background-color: var(--verde-logo); color: #ffffff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
.kpi-card { background-color: var(--crema-fondo); border: 1px solid var(--borde-suave); border-radius: 12px; padding: 20px; text-align: center; }
.kpi-value { font-size: 2.2rem; font-weight: 700; color: var(--verde-logo); }
.kpi-label { font-size: 0.8rem; color: var(--texto-secundario); text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
.admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
.admin-table th, .admin-table td { border: 1px solid var(--borde-suave); padding: 10px; text-align: left; }
.admin-table th { background-color: var(--crema-fondo); color: var(--verde-logo); font-weight: 700; }
</style>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpuNy4n55XR0HHYWZpdibJ61jQujYAdtVxd8fp9C6LUCdDZG12c4UTMTZiuUVdhU4_/exec";

let surveyResponses = [];


/* =========================
   CAMBIAR DE PESTAÑA
========================= */
function switchTab(tab) {
    const encuesta = document.getElementById("seccion-encuesta");
    const resultados = document.getElementById("seccion-resultados");

    if (tab === "encuesta") {
        encuesta.style.display = "block";
        resultados.style.display = "none";
    } else {
        encuesta.style.display = "none";
        resultados.style.display = "block";
        updateDashboard();
    }
}


/* =========================
   SELECCIONAR OPCIÓN
========================= */
function selectOption(element, group) {

    const container = document.getElementById(group);

    if (!container) return;

    const options = container.querySelectorAll(".option");

    options.forEach(option => {
        option.classList.remove("selected");
    });

    element.classList.add("selected");
}


/* =========================
   OBTENER RESPUESTA
========================= */
function getSelectedValue(groupId) {

    const container = document.getElementById(groupId);

    if (!container) return "";

    const selected = container.querySelector(".option.selected");

    if (!selected) return "";

    return selected.dataset.value || selected.getAttribute("data-value") || selected.textContent.trim();
}


/* =========================
   ENVIAR ENCUESTA
========================= */
async function submitSurvey(event) {

    event.preventDefault();

    const name = document.getElementById("guest-name").value.trim();
    const reason = document.getElementById("guest-reason").value;
    const room = document.getElementById("guest-room").value.trim();
    const feedback = document.getElementById("guest-feedback").value.trim();

    const csat = getSelectedValue("q1-block");
    const servqual = getSelectedValue("q2-block");
    const tiempo = getSelectedValue("q3-block");
    const calidad = getSelectedValue("q4-block");
    const confianza = getSelectedValue("q5-block");
    const nps = getSelectedValue("q6-block");


    /* =========================
       VALIDACIONES
    ========================= */

    if (!name) {
        alert("Por favor, escribe tu nombre o familia.");
        return;
    }

    if (!reason) {
        alert("Por favor, selecciona el motivo de tu estancia.");
        return;
    }

    if (!room) {
        alert("Por favor, indica la habitación o área.");
        return;
    }

    if (!csat || !servqual || !tiempo || !calidad || !confianza || !nps) {
        alert("Por favor, responde todas las preguntas de valoración.");
        return;
    }


    /* =========================
       CREAR DATOS
    ========================= */

    const datos = {
        name: name,
        reason: reason,
        room: room,
        csat: csat,
        servqual: servqual,
        tiempo: tiempo,
        calidad: calidad,
        confianza: confianza,
        nps: nps,
        feedback: feedback
    };


    /* =========================
       ENVIAR A GOOGLE SHEETS
    ========================= */

    try {

        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(datos)
        });


        /* Guardar también temporalmente en la página */
        surveyResponses.push({
            name: name,
            room: room,
            csat: csat,
            servqual: servqual,
            nps: nps,
            feedback: feedback
        });

        updateDashboard();


        alert("¡Gracias por completar la encuesta! Tu respuesta fue enviada correctamente.");

        /* Ir a resultados */
        switchTab("resultados");

        /* Limpiar formulario */
        document.getElementById("guest-name").value = "";
        document.getElementById("guest-reason").value = "";
        document.getElementById("guest-room").value = "";
        document.getElementById("guest-feedback").value = "";

        document.querySelectorAll(".option.selected").forEach(option => {
            option.classList.remove("selected");
        });

    } catch (error) {

        console.error("Error al enviar:", error);

        alert(
            "No se pudo enviar la encuesta. " +
            "Verifica tu conexión a Internet e inténtalo nuevamente."
        );
    }
}


/* =========================
   ACTUALIZAR TABLA
========================= */
function updateDashboard() {

    const tbody = document.querySelector("#results-table tbody");

    if (!tbody) return;

    tbody.innerHTML = "";

    surveyResponses.forEach(response => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${escapeHTML(response.name)}</td>
            <td>${escapeHTML(response.room)}</td>
            <td>${escapeHTML(response.csat)}</td>
            <td>${escapeHTML(response.servqual)}</td>
            <td>${escapeHTML(response.nps)}</td>
            <td>${escapeHTML(response.feedback)}</td>
        `;

        tbody.appendChild(row);
    });


    /* Actualizar contador */
    const total = document.getElementById("total-responses");

    if (total) {
        total.textContent = surveyResponses.length;
    }
}


/* =========================
   SEGURIDAD PARA TEXTO
========================= */
function escapeHTML(text) {

    if (text === null || text === undefined) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   CAMBIAR IMAGEN
========================= */
function changeImage(src) {

    const mainImage = document.getElementById("main-image");

    if (mainImage) {
        mainImage.src = src;
    }
}


/* =========================
   COMPARTIR
========================= */
function shareCode() {

    const url = window.location.href;

    if (navigator.share) {

        navigator.share({
            title: "Encuesta Estancia Altos de Veracruz",
            text: "Completa nuestra encuesta de satisfacción.",
            url: url
        });

    } else {

        navigator.clipboard.writeText(url);

        alert("El enlace fue copiado.");
    }
}


/* =========================
   INICIO
========================= */
document.addEventListener("DOMContentLoaded", function() {

    updateDashboard();

});
</script>
